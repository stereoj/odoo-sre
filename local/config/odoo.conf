[options]
; This file has no credentials in it — the official Odoo entrypoint reads
; HOST/PORT/USER/PASSWORD_FILE from the environment (set in docker-compose.yml)
; and injects them at process start.
workers = 2
max_cron_threads = 1
limit_time_cpu = 60
limit_time_real = 120
proxy_mode = True
list_db = False
logfile = /dev/stdout
log_level = info
