{{- if .Values.backup.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "odoo.fullname" . }}-backup
  labels:
    {{- include "odoo.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          containers:
            - name: backup
              image: postgres:16-alpine
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              env:
                - name: PGHOST
                  value: {{ .Values.postgresql.host | default (printf "%s-postgresql" (include "odoo.fullname" .)) | quote }}
                - name: PGPORT
                  value: {{ .Values.postgresql.port | quote }}
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.secrets.dbCredentialsSecret }}
                      key: username
                - name: PGPASSWORD_FILE
                  value: /run/secrets/db/password
                - name: RETENTION_DAYS
                  value: {{ .Values.backup.retentionDays | quote }}
                - name: BACKUP_BUCKET
                  value: {{ .Values.backup.destination.bucket | quote }}
              volumeMounts:
                - name: db-secret
                  mountPath: /run/secrets/db
                  readOnly: true
                - name: filestore
                  mountPath: /var/lib/odoo
                  readOnly: true
                - name: backup-tmp
                  mountPath: /backup
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  export PGPASSWORD="$(cat "$PGPASSWORD_FILE")"
                  TS=$(date +%Y%m%d-%H%M%S)

                  echo "Dumping database..."
                  # --format=custom enables parallel restore and selective
                  # table restore later; a plain-text dump does neither.
                  pg_dump --format=custom --file="/backup/odoo-${TS}.dump" \
                    -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" "{{ .Values.postgresql.database }}"

                  echo "Archiving filestore (attachments) alongside the DB dump..."
                  # DB and filestore are backed up together and timestamped
                  # identically — restoring one without the other produces a
                  # database with attachment records pointing at files that
                  # don't exist, which is a silent, delayed-discovery failure.
                  tar czf "/backup/filestore-${TS}.tar.gz" -C /var/lib/odoo .

                  echo "Uploading to s3://${BACKUP_BUCKET}/ with checksum metadata..."
                  LOCAL_SUM=$(sha256sum "/backup/odoo-${TS}.dump" | cut -d' ' -f1)
                  aws s3 cp "/backup/odoo-${TS}.dump" "s3://${BACKUP_BUCKET}/db/odoo-${TS}.dump" \
                    --metadata sha256="${LOCAL_SUM}"
                  aws s3 cp "/backup/filestore-${TS}.tar.gz" "s3://${BACKUP_BUCKET}/filestore/filestore-${TS}.tar.gz"

                  echo "Verifying upload integrity (size + checksum roundtrip)..."
                  LOCAL_SIZE=$(stat -c%s "/backup/odoo-${TS}.dump" 2>/dev/null || stat -f%z "/backup/odoo-${TS}.dump")
                  REMOTE_SIZE=$(aws s3api head-object --bucket "${BACKUP_BUCKET}" --key "db/odoo-${TS}.dump" --query ContentLength --output text)
                  REMOTE_SUM=$(aws s3api head-object --bucket "${BACKUP_BUCKET}" --key "db/odoo-${TS}.dump" --query Metadata.sha256 --output text)
                  # A backup that "completes" but is silently truncated or
                  # corrupted is worse than a missing backup, because nobody
                  # notices until the restore that matters fails. We fail the
                  # job (and page on-call, since the CronJob's failure count
                  # is alerted on) rather than trusting `aws s3 cp`'s exit
                  # code alone — a network blip mid-upload can still exit 0.
                  if [ "$LOCAL_SIZE" != "$REMOTE_SIZE" ] || [ "$LOCAL_SUM" != "$REMOTE_SUM" ]; then
                    echo "BACKUP VERIFICATION FAILED: size or checksum mismatch" >&2
                    exit 1
                  fi

                  echo "Pruning backups older than ${RETENTION_DAYS} days..."
                  CUTOFF=$(date -d "-${RETENTION_DAYS} days" +%Y%m%d 2>/dev/null || date -v-"${RETENTION_DAYS}"d +%Y%m%d)
                  aws s3 ls "s3://${BACKUP_BUCKET}/db/" | awk '{print $4}' | while read -r f; do
                    FDATE=$(echo "$f" | grep -oE '[0-9]{8}' | head -1)
                    [ -n "$FDATE" ] && [ "$FDATE" -lt "$CUTOFF" ] && aws s3 rm "s3://${BACKUP_BUCKET}/db/${f}"
                  done

                  echo "Backup ${TS} completed and verified."
          volumes:
            - name: db-secret
              secret:
                secretName: {{ .Values.secrets.dbCredentialsSecret }}
            - name: filestore
              persistentVolumeClaim:
                claimName: {{ include "odoo.fullname" . }}-filestore
            - name: backup-tmp
              emptyDir:
                sizeLimit: 10Gi
{{- end }}
