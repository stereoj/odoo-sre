# This file documents the shape of the two Secrets this chart expects.
# It is NEVER applied as-is and contains no real values — it exists so a
# reviewer can see exactly what's expected without guessing.
#
# In real environments these are created by External Secrets Operator (pulling
# from AWS Secrets Manager / GCP Secret Manager) or Sealed Secrets — never by
# `kubectl apply -f` on plaintext, and never committed to git.
#
# Example creation for local/dev testing only:
#   kubectl create secret generic odoo-db-credentials \
#     --from-literal=username=odoo \
#     --from-literal=password="$(openssl rand -base64 32)"
#   kubectl create secret generic odoo-admin-credentials \
#     --from-literal=password="$(openssl rand -base64 32)"

apiVersion: v1
kind: Secret
metadata:
  name: odoo-db-credentials
type: Opaque
stringData:
  username: "REDACTED"
  password: "REDACTED"
---
apiVersion: v1
kind: Secret
metadata:
  name: odoo-admin-credentials
type: Opaque
stringData:
  password: "REDACTED"
